name: CI

on:
  push:
    branches:
      - "**" # double star includes a '/'. single star doesn't match a '/'
    tags:
      - "**" # double star includes a '/'. single star doesn't match a '/'
  schedule:
    # Daily at 05:44
    - cron: '44 5 * * *'

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: 3.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-build
        run: |
          if [false] then
            echo "IF TRUE STATEMENT"
          else
            echo "IF FALSE STATEMENT"
          fi
